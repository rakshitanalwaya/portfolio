# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect github.com/rakshitanalwaya/portfolio

services:
  - type: web
    name: rakshita-portfolio
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run init-db
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: BASE_PATH
        value: /
      - key: ADMIN_TOKEN
        generateValue: true
